<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>常用店家線上點餐捷徑</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 圖示庫 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'media',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0284c7',
              600: '#0284c7',
              700: '#0369a1',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* 隱藏滾動條但保持功能 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen pb-24 font-sans antialiased selection:bg-brand-500 selection:text-white">

  <!-- 頂部 Header -->
  <header class="sticky top-0 z-30 bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-700/60 px-4 py-3 shadow-sm">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center text-white shadow-md shadow-sky-500/20">
          <i class="fa-solid font-bold fa-utensils text-lg"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-tight text-slate-900 dark:text-white leading-tight">線上點餐捷徑</h1>
          <p class="text-xs text-slate-500 dark:text-slate-400">點餐與候位，一鍵開啟</p>
        </div>
      </div>
      <div class="flex items-center gap-1">
        <button onclick="openModal('pwaModal')" class="p-2 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition" title="加到主畫面">
          <i class="fa-solid fa-mobile-screen-button text-lg"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- 主內容區 -->
  <main class="max-w-md mx-auto px-4 pt-3 space-y-3">

    <!-- 搜尋欄 -->
    <div class="relative">
      <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
      <input type="text" id="searchInput" oninput="renderStoreList()" placeholder="搜尋店家名稱或分類..." 
        class="w-full pl-10 pr-9 py-2.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 shadow-sm transition">
      <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-xs p-1">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <!-- 分類標籤篩選 -->
    <div id="categoryContainer" class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1 text-sm">
      <!-- 標籤將由 JS 動態生成 -->
    </div>

    <!-- 店家卡片列表 -->
    <div id="storeList" class="space-y-2">
      <!-- 卡片內容由 JS 動態生成 -->
    </div>

    <!-- 空狀態提示 -->
    <div id="emptyState" class="hidden text-center py-12 px-4">
      <div class="w-16 h-16 bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center mx-auto mb-3 text-slate-400 text-2xl">
        <i class="fa-solid fa-store-slash"></i>
      </div>
      <p class="text-slate-600 dark:text-slate-300 font-medium">找不到相關店家</p>
      <p class="text-xs text-slate-400 mt-1">請調整搜尋關鍵字或分類。</p>
    </div>

  </main>

  <!-- 提示訊息 Toast -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-slate-900/90 dark:bg-white/90 text-white dark:text-slate-900 text-xs px-4 py-2.5 rounded-full shadow-xl pointer-events-none transition-all duration-300 opacity-0 translate-y-4 flex items-center gap-2 backdrop-blur-sm">
    <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400 dark:text-emerald-600"></i>
    <span id="toastMessage">已複製網址</span>
  </div>

  <!-- 加到主畫面 (PWA) 指引 Modal -->
  <div id="pwaModal" class="fixed inset-0 z-40 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-200">
    <div class="bg-white dark:bg-slate-800 w-full max-w-md rounded-2xl p-6 shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b pb-3 border-slate-100 dark:border-slate-700">
        <h3 class="text-base font-bold text-slate-900 dark:text-white flex items-center gap-2">
          <i class="fa-solid fa-mobile-screen text-sky-500"></i>
          將此網頁加到手機主畫面
        </h3>
        <button onclick="closeModal('pwaModal')" class="text-slate-400 hover:text-slate-600">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <p class="text-xs text-slate-500 dark:text-slate-400">設定後即可像 App 一樣直接從桌面打開點餐：</p>

      <!-- iOS 指引 -->
      <div class="bg-slate-50 dark:bg-slate-700/40 p-3.5 rounded-xl border border-slate-200/60 dark:border-slate-700 space-y-2">
        <div class="flex items-center gap-2 text-xs font-bold text-slate-800 dark:text-slate-200">
          <i class="fa-brands fa-apple text-base"></i> iOS (Safari 瀏覽器)
        </div>
        <ol class="text-xs text-slate-600 dark:text-slate-300 list-decimal list-inside space-y-1 pl-1">
          <li>點擊 Safari 下方的 <i class="fa-solid fa-share-nodes text-sky-500"></i> 「分享」按鈕。</li>
          <li>向上滑動選單，點選 <i class="fa-regular fa-square-plus text-sky-500"></i> <strong>「加入主畫面」</strong>。</li>
          <li>點擊右上角「新增」即可完成。</li>
        </ol>
      </div>

      <!-- Android 指引 -->
      <div class="bg-slate-50 dark:bg-slate-700/40 p-3.5 rounded-xl border border-slate-200/60 dark:border-slate-700 space-y-2">
        <div class="flex items-center gap-2 text-xs font-bold text-slate-800 dark:text-slate-200">
          <i class="fa-brands fa-android text-base text-emerald-500"></i> Android (Chrome 瀏覽器)
        </div>
        <ol class="text-xs text-slate-600 dark:text-slate-300 list-decimal list-inside space-y-1 pl-1">
          <li>點擊 Chrome 右上角 <i class="fa-solid fa-ellipsis-vertical text-slate-500"></i> 選單圖示。</li>
          <li>點選 <strong>「加到主畫面」</strong> 或 「安裝應用程式」。</li>
          <li>依提示點擊「新增」即可完成。</li>
        </ol>
      </div>

      <button onclick="closeModal('pwaModal')" class="w-full py-2.5 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-xl font-medium text-sm hover:bg-slate-200 dark:hover:bg-slate-600 transition">了解，我知道了</button>
    </div>
  </div>

  <!-- JavaScript 邏輯 -->
  <script>
    // 預設店家資料（包含照片中的兩家店家）
    const INITIAL_STORES = [
      {
        id: '1',
        name: '八方雲集（延平南店）',
        category: '外帶點餐',
        url: 'https://onlineorder.8way.com.tw/NOrder.aspx?SID=0875&OTP=09', // 延平南店 QR 碼
      },
      {
        id: '2',
        name: '一沐日（台北延平南店）',
        category: '飲料店',
        url: 'https://aniceholiday.doteat.tw/menu?storeId=NQv0nErm-00006vf7Le&showBulletin=1&utm_source=store&utm_medium=qrcode&utm_campaign=6956&waitOnSpotMode=1', // 台北延平南店 QR 碼
      },

      {
        id: '3',
        name: '鬍鬚張（台北南門店）',
        category: '外帶點餐',
        url: 'https://ddc.ai/3zeeVm',
      },
      {
        id: '4',
        name: '樂天皇朝（宏匯廣場）',
        category: '內用候位',
        url: 'https://inline.app/-LRIFWFrmwD1RkG6jysN:inline-live-2a466/-NibSLtgOfzmxguiLkAw/waiting',
      },

      {
        id: '5',
        name: '雙月（濟南店）',
        category: '外帶點餐',
        url: 'https://line.quickclick.cc/line/views/web/menu?accountId=7217&token=3960ccdf0395eeffdbb2e31165101e64f5417472c7b72cbf18db6605d739a876',
      },
      {
        id: '6',
        name: '梁社漢排骨（中正廣州店）',
        category: '外帶點餐',
        url: 'https://ezorder.8way.com.tw/100003',
      },
      {
        id: '7',
        name: '梁社漢排骨（萬華青年店）',
        category: '外帶點餐',
        url: 'https://ezorder.8way.com.tw/108002',
      }
    ];

    // 全局狀態
    let stores = [];
    let selectedCategory = '全部';

    // 頁面初始化
    window.onload = function() {
      loadStores();
      renderCategoryTags();
      renderStoreList();
    };

    // 店家資料直接由 INITIAL_STORES 維護；每天以日期為種子重新排列
    function loadStores() {
      stores = INITIAL_STORES.map(store => ({ ...store }));

      const today = new Date();
      const daySeed = today.getFullYear() * 10000 + (today.getMonth() + 1) * 100 + today.getDate();
      let seed = daySeed;
      const randomForToday = () => {
        seed = (seed * 9301 + 49297) % 233280;
        return seed / 233280;
      };

      for (let i = stores.length - 1; i > 0; i--) {
        const j = Math.floor(randomForToday() * (i + 1));
        [stores[i], stores[j]] = [stores[j], stores[i]];
      }

      // 梁社漢排骨每日仍隨機排列；中正廣州店固定優先於其他分店
      const guangzhouIndex = stores.findIndex(store =>
        store.name.includes('梁社漢排骨') && store.name.includes('中正廣州店')
      );
      if (guangzhouIndex > 0) {
        const [guangzhouStore] = stores.splice(guangzhouIndex, 1);
        const firstLiangIndex = stores.findIndex(store => store.name.includes('梁社漢排骨'));
        stores.splice(firstLiangIndex >= 0 ? firstLiangIndex : guangzhouIndex, 0, guangzhouStore);
      }
    }

    // 渲染分類標籤
    function renderCategoryTags() {
      const categories = ['全部', ...new Set(stores.map(s => s.category))];
      const container = document.getElementById('categoryContainer');
      
      container.innerHTML = categories.map(cat => {
        const isActive = cat === selectedCategory;
        const activeClass = isActive 
          ? 'bg-sky-600 text-white shadow-sm shadow-sky-500/30' 
          : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700';
        return `
          <button onclick="filterCategory('${cat}')" class="px-3.5 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap transition-all ${activeClass}">
            ${cat}
          </button>
        `;
      }).join('');
    }

    // 篩選分類
    function filterCategory(category) {
      selectedCategory = category;
      renderCategoryTags();
      renderStoreList();
    }

    // 搜尋清除
    function clearSearch() {
      document.getElementById('searchInput').value = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      renderStoreList();
    }

    // 渲染精簡店家列表
    function renderStoreList() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const clearBtn = document.getElementById('clearSearchBtn');
      clearBtn.classList.toggle('hidden', !query);

      const filtered = stores.filter(store => {
        const matchesCat = selectedCategory === '全部' || store.category === selectedCategory;
        const matchesQuery = store.name.toLowerCase().includes(query) ||
                             store.category.toLowerCase().includes(query);
        return matchesCat && matchesQuery;
      });

      const listEl = document.getElementById('storeList');
      const emptyEl = document.getElementById('emptyState');

      if (filtered.length === 0) {
        listEl.innerHTML = '';
        emptyEl.classList.remove('hidden');
        return;
      }

      emptyEl.classList.add('hidden');
      listEl.innerHTML = filtered.map(store => `
        <div class="bg-white dark:bg-slate-800 border border-slate-200/80 dark:border-slate-700/80 rounded-xl px-3 py-2.5 shadow-sm flex items-center gap-3">
          <div class="w-9 h-9 shrink-0 rounded-xl bg-sky-50 dark:bg-sky-950/50 text-sky-600 dark:text-sky-400 flex items-center justify-center">
            <span class="text-lg leading-none" aria-hidden="true">${store.category === '外帶點餐' ? '🍱' : store.category === '內用候位' ? '🍽️' : '🥤'}</span>
          </div>
          <div class="min-w-0 flex-1">
            <h2 class="text-sm font-bold text-slate-900 dark:text-white leading-tight whitespace-normal break-words">${escapeHtml(store.name)}</h2>
            
          </div>
          <div class="flex shrink-0 items-center gap-1.5">
            <button onclick="copyToClipboard('${escapeHtml(store.url)}')" title="複製連結" aria-label="複製連結"
              class="w-8 h-8 rounded-lg text-slate-400 hover:text-sky-600 dark:hover:text-sky-400 flex items-center justify-center">
              <i class="fa-regular fa-copy text-xs"></i>
            </button>
            <a href="${escapeHtml(store.url)}" target="_blank" rel="noopener noreferrer"
              class="bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-600 hover:to-blue-700 text-white font-medium text-xs py-2 px-3 rounded-lg shadow-sm flex items-center justify-center gap-1.5 transition active:scale-95">
              <i class="fa-solid fa-arrow-up-right-from-square"></i>
              <span>${store.category === '內用候位' ? '立即候位' : '立即點餐'}</span>
            </a>
          </div>
        </div>
      `).join('');
    }

    // 複製文字功能 (適應 iframe 限制)
    function copyToClipboard(text) {
      const dummy = document.createElement('textarea');
      document.body.appendChild(dummy);
      dummy.value = text;
      dummy.select();
      document.execCommand('copy');
      document.body.removeChild(dummy);

      showToast('已複製點餐網址！', 'fa-circle-check');
    }

    // 顯示 Toast 訊息
    function showToast(msg, icon = 'fa-circle-check') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMessage');
      const toastIcon = document.getElementById('toastIcon');

      toastMsg.innerText = msg;
      toastIcon.className = `fa-solid ${icon} text-emerald-400 dark:text-emerald-500`;

      toast.classList.remove('opacity-0', 'translate-y-4');
      toast.classList.add('opacity-100', 'translate-y-0');

      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-4');
      }, 2000);
    }

    // 開啟通用 Modal
    function openModal(id) {
      const modal = document.getElementById(id);
      modal.classList.remove('opacity-0', 'pointer-events-none');
      const inner = modal.querySelector('div');
      inner.classList.remove('translate-y-full');
    }

    // 關閉通用 Modal
    function closeModal(id) {
      const modal = document.getElementById(id);
      const inner = modal.querySelector('div');
      inner.classList.add('translate-y-full');
      modal.classList.add('opacity-0', 'pointer-events-none');
    }

    // HTML 轉義字元保護
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
